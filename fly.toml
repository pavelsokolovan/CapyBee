app = "capybee"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# wait 5 min for Spring Boot cold start + Fly Postgres wake-up
[[http_service.checks]]
  grace_period = "300s"
  interval = "30s"
  timeout = "10s"
  path = "/actuator/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
