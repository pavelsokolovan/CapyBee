name: Build, Test & Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-engine:
    name: Standalone Engine SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify engine without application services
        run: mvn -B -f engine/pom.xml clean verify
      - name: Upload engine test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: |
            engine/target/surefire-reports/
            engine/target/site/jacoco/
          retention-days: 30

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capybee
          POSTGRES_PASSWORD: capybee
          POSTGRES_DB: capybee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capybee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/ui/package-lock.json'

      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Audit UI dependencies
        working-directory: app/ui
        run: npm audit --audit-level=high

      - name: Run UI tests and coverage gate
        working-directory: app/ui
        run: npm run test:coverage

      - name: Build UI
        working-directory: app/ui
        run: npm run build

      - name: Lint UI (if available)
        working-directory: app/ui
        run: npm run lint --if-present || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn -B -pl app/server -am verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/capybee
          SPRING_DATASOURCE_USERNAME: capybee
          SPRING_DATASOURCE_PASSWORD: capybee

      - name: Build backend JAR
        run: mvn -B -DskipTests -pl app/server -am package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/server/target/surefire-reports/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/server/target/site/jacoco/
          retention-days: 30

      - name: Upload UI coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: app/ui/coverage/
          retention-days: 30
