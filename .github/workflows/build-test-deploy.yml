name: Build, Test & Deploy to Fly.io

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/ui/package-lock.json'

      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Build UI
        working-directory: app/ui
        run: npm run build

      - name: Lint UI (if available)
        working-directory: app/ui
        run: npm run lint --if-present || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: app/server
        run: mvn -B test

      - name: Build backend JAR
        working-directory: app/server
        run: mvn -B -DskipTests package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/server/target/surefire-reports/
          retention-days: 30

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only deploy on successful build of main branch (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: ${{ github.workspace }}

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ Successfully deployed to Fly.io"
          echo "App URL: https://capybee.fly.dev"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to Fly.io failed"
          exit 1
