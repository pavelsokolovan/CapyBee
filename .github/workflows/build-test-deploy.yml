name: Build, Test & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-engine:
    name: Standalone Engine SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify engine without application services
        run: mvn -B -f app/engine/pom.xml clean verify
      - name: Upload engine test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: |
            app/engine/target/surefire-reports/
            app/engine/target/site/jacoco/
          retention-days: 30

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capybee
          POSTGRES_PASSWORD: capybee
          POSTGRES_DB: capybee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capybee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/ui/package-lock.json'

      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Audit UI dependencies
        working-directory: app/ui
        run: npm audit --audit-level=high

      - name: Run UI tests and coverage gate
        working-directory: app/ui
        run: npm run test:coverage

      - name: Build UI
        working-directory: app/ui
        run: npm run build

      - name: Lint UI (if available)
        working-directory: app/ui
        run: npm run lint --if-present || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f app/pom.xml -pl server -am verify

      - name: Build backend JAR
        run: mvn -B -f app/pom.xml -DskipTests -pl server -am package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/server/target/surefire-reports/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/server/target/site/jacoco/
          retention-days: 30

      - name: Upload UI coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: app/ui/coverage/
          retention-days: 30

  deploy:
    name: Deploy to Fly.io
    needs: [build-engine, build-and-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: capybee-fly-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check deployment credential
        shell: bash
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add an app-scoped Fly deploy token as the FLY_API_TOKEN repository Actions secret. See docs/fly-deployment.md."
            exit 1
          fi
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Build and deploy tested revision
        run: >-
          flyctl deploy --remote-only --app capybee --config fly.toml
          --build-arg CAPYBEE_REVISION=${{ github.sha }} --wait-timeout 10m
      - name: Verify deployed application health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
            https://capybee.fly.dev/actuator/health -o /tmp/capybee-health.json
          python3 -c 'import json; assert json.load(open("/tmp/capybee-health.json"))["status"] == "UP", "Fly application is unhealthy"'
