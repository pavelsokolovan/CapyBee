name: Engine release certification
on:
  workflow_dispatch:
    inputs:
      run_live: {description: Run paid full dynamic certification, required: true, type: boolean, default: false}
      model_id: {description: Exact pinned provider model ID, required: false, type: string}
      max_provider_calls: {description: Reviewed provider call ceiling, required: false, type: string}
      max_cost_usd: {description: Reviewed estimated cost ceiling, required: false, type: string}
permissions: {contents: read}
concurrency: {group: engine-release-${{ github.ref }}, cancel-in-progress: false}

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-java@7a445ee88d4e23b52c33d877b15a4526449f2c7d
        with: {java-version: '25', distribution: temurin, cache: maven}
      - name: Full engine verification
        run: mvn -B -f app/engine/pom.xml clean verify
      - name: Build canonical candidate once
        shell: pwsh
        run: ./scripts/package-engine.ps1 -SourceRevision '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-candidate
          path: |
            app/engine/target/distribution/*.zip
            app/engine/target/distribution/*.sha256
            app/engine/target/distribution/*.json
            app/engine/target/distribution/capybee-server.jar
            app/engine/target/distribution/capybee-server.sbom.cdx.json
          retention-days: 30

  verify:
    needs: candidate
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33d877b15a4526449f2c7d
        with: {java-version: '25', distribution: temurin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: engine-candidate, path: app/engine/target/distribution}
      - name: Verify downloaded bytes and clean extraction
        shell: pwsh
        run: |
          $candidate = Get-Content -Raw app/engine/target/distribution/candidate.json | ConvertFrom-Json
          ./scripts/verify-engine-package.ps1 -Archive "app/engine/target/distribution/$($candidate.archive.file)" -ServerJar app/engine/target/distribution/capybee-server.jar
          ./scripts/test-release-package.ps1 -Archive "app/engine/target/distribution/$($candidate.archive.file)"

  offline:
    needs: [candidate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33d877b15a4526449f2c7d
        with: {java-version: '25', distribution: temurin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: engine-candidate, path: app/engine/target/distribution}
      - name: Archive-level Pack and dynamic offline certification
        shell: pwsh
        run: ./dev.ps1 game-certify-offline -SkipBuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: engine-offline-evidence, path: app/engine/target/evidence, retention-days: 90}

  server-postgres:
    needs: [candidate, verify]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: capybee, POSTGRES_USER: capybee, POSTGRES_PASSWORD: capybee}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capybee -d capybee"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33d877b15a4526449f2c7d
        with: {java-version: '25', distribution: temurin, cache: maven}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: engine-candidate, path: app/engine/target/distribution}
      - name: PostgreSQL 16 migration, restart, and compatibility gate
        shell: pwsh
        run: ./scripts/certify-server-postgres.ps1 -UseExistingPostgres

  live-full:
    if: inputs.run_live
    needs: [candidate, verify, offline, server-postgres]
    runs-on: ubuntu-latest
    environment: engine-live-certification
    env:
      GENERATION_PROVIDER_MODE: certification
      GENERATION_MODEL_ID: ${{ inputs.model_id }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROVIDER_PRICING_JSON: ${{ secrets.PROVIDER_PRICING_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33d877b15a4526449f2c7d
        with: {java-version: '25', distribution: temurin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: engine-candidate, path: app/engine/target/distribution}
      - name: Extract exact offline-approved candidate
        shell: pwsh
        run: |
          $candidate = Get-Content -Raw app/engine/target/distribution/candidate.json | ConvertFrom-Json
          ./scripts/verify-engine-package.ps1 -Archive "app/engine/target/distribution/$($candidate.archive.file)" -ExtractTo app/engine/target/live-candidate
          Set-Content -LiteralPath app/engine/target/provider-pricing.json -Value $env:PROVIDER_PRICING_JSON -Encoding utf8NoBOM
      - name: Full paid dynamic certification
        shell: pwsh
        run: >-
          java -jar app/engine/target/live-candidate/bin/engine-cli.jar certify --mode live --dynamic --scope full
          --profile-dir app/engine/target/live-candidate/profiles/generic-adventure
          --suite app/engine/target/live-candidate/certification/dynamic-live-v1/suite.json
          --pricing-file app/engine/target/provider-pricing.json
          --max-provider-calls ${{ inputs.max_provider_calls }} --max-cost-usd ${{ inputs.max_cost_usd }}
          --evidence-dir app/engine/target/live-evidence --confirm-live-provider-cost
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: restricted-live-dynamic-evidence, path: app/engine/target/live-evidence, retention-days: 30}
