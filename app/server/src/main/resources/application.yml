spring:
  application:
    name: capybee
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/capybee}
    username: ${SPRING_DATASOURCE_USERNAME:capybee}
    password: ${SPRING_DATASOURCE_PASSWORD:capybee}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      max-lifetime: 900000
      keepalive-time: 120000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 10s
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30d
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      cookie:
        max-age: 30d
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.capybee: INFO

capybee:
  game:
    enabled: ${CAPYBEE_GAME_ENABLED:false}
    generation-enabled: ${CAPYBEE_GAME_GENERATION_ENABLED:false}
    allow-seed: ${CAPYBEE_GAME_ALLOW_SEED:false}
    pack-ids: ${CAPYBEE_GAME_PACK_IDS:}
    command-hmac-key: ${CAPYBEE_GAME_COMMAND_HMAC_KEY:${APP_SECRET:}}
    sync-wait-ms: ${CAPYBEE_GAME_SYNC_WAIT_MS:8000}
    lease-seconds: ${CAPYBEE_GAME_LEASE_SECONDS:30}
    start-ttl-seconds: ${CAPYBEE_GAME_START_TTL_SECONDS:600}
    max-concurrent-generation: ${CAPYBEE_GAME_MAX_CONCURRENT_GENERATION:2}
    day-zone: ${CAPYBEE_GAME_DAY_ZONE:UTC}
    limits:
      commands-per-minute: ${CAPYBEE_GAME_COMMANDS_PER_MINUTE:60}
      profile-calls-per-day: ${CAPYBEE_GAME_PROFILE_CALLS_PER_DAY:40}
      global-calls-per-day: ${CAPYBEE_GAME_GLOBAL_CALLS_PER_DAY:1500}
      run-calls: ${CAPYBEE_GAME_RUN_CALLS:24}
    prefetch:
      profile-reserve: ${CAPYBEE_GAME_PREFETCH_PROFILE_RESERVE:8}
      global-reserve: ${CAPYBEE_GAME_PREFETCH_GLOBAL_RESERVE:100}
      run-reserve: ${CAPYBEE_GAME_PREFETCH_RUN_RESERVE:4}
