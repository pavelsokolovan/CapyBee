server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true

logging:
  level:
    root: INFO

capybee:
  game:
    enabled: ${CAPYBEE_GAME_ENABLED:true}
    web-client-enabled: ${CAPYBEE_GAME_WEB_CLIENT_ENABLED:true}
    pack-ids: ${CAPYBEE_GAME_PACK_IDS:capybee-anonymous-note,capybee-new-hive}
    dynamic:
      profile-ids: ${CAPYBEE_GAME_DYNAMIC_PROFILE_IDS:generic-adventure,classic-detective}
